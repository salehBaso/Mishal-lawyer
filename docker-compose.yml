version: '3.9'

# بيئة تطوير محلية سريعة: PostgreSQL + Redis
# التشغيل: docker compose up -d

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mishal_legal
    ports:
      - '5432:5432'
    volumes:
      - mishal_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - mishal_redis_data:/data

volumes:
  mishal_postgres_data:
  mishal_redis_data:
